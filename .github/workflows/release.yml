env:
  DIRECTORY: distribution
  PROJECT_NAME: refined-forgejo

name: Release
on:
  workflow_dispatch: null

permissions:
  contents: write

jobs:
  Version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test and build
        run: pnpm build
      - name: Create tag if necessary
        uses: fregante/daily-version-action@v2
      - name: Update manifest.json with version
        run: |
          if [ -n "$DAILY_VERSION" ]; then
            VERSION="$DAILY_VERSION"
          else
            git fetch --depth=1 origin 'refs/tags/*:refs/tags/*' || true
            VERSION=$(git describe --tags --abbrev=0)
          fi
          npx dot-json@1 "$DIRECTORY/manifest.json" version "$VERSION"
      - name: Create release
        if: env.DAILY_VERSION_CREATED
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ${{ env.DIRECTORY }}
        run: |
          FILENAME="$PROJECT_NAME-$DAILY_VERSION-for-local-testing-only.zip"
          zip -r "$FILENAME" ./*
          gh release create "$DAILY_VERSION" "$FILENAME" --draft --generate-notes
